<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Store Shopping Basket Icon -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Basket Handles -->
    <path d="M-90,-40 C-90,-110 90,-110 90,-40" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Basket Body -->
    <path d="M-130,-30 L130,-30 L100,100 C95,120 75,135 50,135 L-50,135 C-75,135 -95,120 -100,100 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="20" stroke-linejoin="round" />
    
    <!-- Sparkle / AI Nodes -->
    <circle cx="0" cy="-10" r="14" fill="url(#goldGrad)" filter="url(#glow)" />
    <path d="M0,-35 L0,15 M-25,-10 L25,-10" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="-50" cy="20" r="10" fill="#34d399" />
    <circle cx="50" cy="20" r="10" fill="#34d399" />
    <path d="M-50,20 L0,-10 L50,20" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="8,6" />
  </g>
  
  <!-- Text Badge at Bottom -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-weight="900" font-size="42" fill="#fef08a" text-anchor="middle" letter-spacing="4">SEMBAKO AI</text>
</svg>
